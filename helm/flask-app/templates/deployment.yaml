apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flask-app.fullname" . }}
  labels:
    {{- include "flask-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "flask-app.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "flask-app.fullname" . }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: flask
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP

          {{- if .Values.databaseSecretName }}
          envFrom:
            - secretRef:
                name: {{ .Values.databaseSecretName | quote }}
          {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          
          volumeMounts:
          - name: app-logs
            mountPath: /var/log/flask

          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}

          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}

        - name: fluent-bit
          image: {{ .Values.fluentBit.image }}
          imagePullPolicy: IfNotPresent

          resources:
            {{- toYaml .Values.fluentBit.resources | nindent 12 }}

          volumeMounts:
            - name: app-logs
              mountPath: /var/log/flask

            - name: fluent-bit-config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf

      volumes:
        - name: app-logs
          emptyDir: {}

        - name: fluent-bit-config
          configMap:
            name: {{ include "flask-app.fullname" . }}-fluent-bit