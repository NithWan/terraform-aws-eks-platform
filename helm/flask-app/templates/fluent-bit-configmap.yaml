apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flask-app.fullname" . }}-fluent-bit
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Log_Level     info

    [INPUT]
        Name          tail
        Path          /var/log/flask/app.log
        Tag           flask.app
        Refresh_Interval 5
        Read_from_Head true

    [OUTPUT]
        Name                cloudwatch_logs
        Match               flask.*
        region              {{ .Values.aws.region }}
        log_group_name      {{ .Values.fluentBit.logGroup }}
        log_stream_prefix   {{ .Values.fluentBit.logStreamPrefix }}
        auto_create_group   false