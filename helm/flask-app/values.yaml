replicaCount: 2

image:
  repository: 590183658640.dkr.ecr.us-west-2.amazonaws.com/eks-flask-app
  tag: 2
  pullPolicy: IfNotPresent

serviceAccount:
  create: false
  name: app-service-account
  roleArn: ""

# Name of a Kubernetes Secret (created by Terraform) that contains
# database credentials as environment variables (DB_HOST, DB_PORT,
# DB_NAME, DB_USERNAME, DB_PASSWORD). Leave empty to disable.
databaseSecretName: database-credentials

service:
  type: LoadBalancer
  port: 80
  targetPort: 5000

containerPort: 5000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10