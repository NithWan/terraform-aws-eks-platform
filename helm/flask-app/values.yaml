replicaCount: 2

image:
  repository: 590183658640.dkr.ecr.us-west-2.amazonaws.com/eks-flask-app
  tag: v2
  pullPolicy: IfNotPresent

serviceAccount:
  create: false
  name: app-service-account
  roleArn: ""

databaseSecretName: database-credentials

service:
  type: LoadBalancer
  port: 80
  targetPort: 5000

containerPort: 5000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10

fluentBit:
  image: public.ecr.aws/aws-observability/aws-for-fluent-bit:latest

  logGroup: /eks/flask-app
  logStreamPrefix: flask-app

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

aws:
  region: us-west-2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10

  cpu:
    enabled: true
    targetUtilizationPercentage: 50

  memory:
    enabled: true
    targetUtilizationPercentage: 70